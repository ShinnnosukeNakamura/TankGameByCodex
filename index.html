<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ironcrawl Tanks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="hud__title">
          <div class="hud__brand">Ironcrawl Tanks</div>
          <div class="hud__subtitle">市街地バンカー襲撃</div>
        </div>
        <div class="hud__stats">
          <div>フロア: <span id="floor">1</span></div>
          <div>HP: <span id="hp">6</span></div>
          <div>弾薬: <span id="ammo">8</span></div>
          <div>スコア: <span id="score">0</span></div>
        </div>
        <div class="hud__actions">
          <button id="pauseBtn" class="btn" type="button">一時停止</button>
          <button id="restartBtn" class="btn" type="button">やり直し</button>
        </div>
      </header>

      <section class="board-wrapper">
        <canvas
          id="board"
          width="480"
          height="480"
          aria-label="ローグライク戦車ゲームのマップ"
        ></canvas>
        <div id="overlay" class="overlay" aria-live="polite" aria-atomic="true">
          <div class="overlay__panel">
            <p id="overlayMessage" class="overlay__message"></p>
            <form id="scoreForm" class="score-form" autocomplete="off" novalidate>
              <label class="score-form__label" for="playerName">名前 (最大8文字)</label>
              <div class="score-form__row">
                <input
                  id="playerName"
                  name="playerName"
                  type="text"
                  maxlength="8"
                  inputmode="text"
                  placeholder="ACE"
                />
                <button id="submitScoreBtn" class="btn btn--accent" type="submit">
                  登録
                </button>
              </div>
              <div id="scoreStatus" class="score-form__status" role="status"></div>
            </form>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="オンスクリーン操作">
        <div class="controls__row">
          <button class="btn" data-action="move-up" type="button">上</button>
        </div>
        <div class="controls__row">
          <button class="btn" data-action="move-left" type="button">左</button>
          <button class="btn" data-action="move-down" type="button">下</button>
          <button class="btn" data-action="move-right" type="button">右</button>
        </div>
        <div class="controls__row controls__row--extra">
          <button class="btn btn--accent" data-action="fire" type="button">射撃</button>
        </div>
      </section>

      <section class="leaderboard" aria-label="ランキング">
        <div class="leaderboard__header">
          <div class="leaderboard__title">ランキング</div>
          <button id="refreshBoardBtn" class="btn btn--ghost" type="button">
            更新
          </button>
        </div>
        <ol id="leaderboardList" class="leaderboard__list"></ol>
      </section>

      <section class="log" aria-label="戦闘ログ">
        <div class="log__title">戦闘ログ</div>
        <ul id="log" class="log__list"></ul>
      </section>

      <p class="hint">
        矢印/WASDで移動。Spaceで射撃。Pで一時停止。Rでやり直し。
      </p>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
